name: build
on:
  pull_request
jobs:
  scan:
    runs-on: ubuntu-latest
    name: bridgecrew-action
    strategy:
      matrix:
        python-version: [3.7]
    steps:
      - uses: actions/checkout@v2
      - name: Run Bridgecrew 
        id: Bridgecrew
        uses: bridgecrewio/bridgecrew-action@master
        with:
         api-key: ${{ secrets.BRIDGECREW_API_KEY }}
         directory: "terraform/aws"
         framework: terraform
         log_level: DEBUG
