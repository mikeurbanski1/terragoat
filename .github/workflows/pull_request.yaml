name: build
on:
  pull_request
jobs:
  scan:
    runs-on: ubuntu-latest
    name: bridgecrew-action
    strategy:
      matrix:
        python-version: [3.7]
    steps:
      - uses: actions/checkout@v3
      - name: Run Bridgecrew 
        id: Bridgecrew
        uses: bridgecrewio/checkov-action@master 
        env:
          PRISMA_API_URL: https://api0.prismacloud.io
        with:
          api-key: ${{ secrets.BRIDGECREW_API_KEY }}
          log_level: DEBUG
